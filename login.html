<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Welcome Back — BAKED IT</title>

<!-- Port penuh komponen AuthForm (sign-in-1) dari Tailwind ke CSS biasa.
     Semua gaya ditulis di berkas ini karena styles.css ikut dijaga
     middleware — halaman login tidak boleh bergantung padanya. -->
<script>
  /* Dijalankan sebelum halaman digambar supaya tidak ada kedipan warna. */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('login-theme'); } catch (e) {}
    var dark = saved
      ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>

<style>
  /* Token shadcn pada skala netral (zinc) — putih & hitam, tanpa nada biru.
     :root = tema terang. Blok berikutnya menimpanya untuk tema gelap. */
  :root{
    --background:        #ffffff;
    --card:              #ffffff;
    --card-foreground:   #09090b;
    --muted-foreground:  #71717a;
    --border:            #e4e4e7;
    --input:             #e4e4e7;
    --primary:           #18181b;
    --primary-foreground:#fafafa;
    --primary-hover:     #27272a;
    --secondary:         #f4f4f5;
    --secondary-fg:      #18181b;
    --secondary-hover:   #ebebed;
    --accent:            #f4f4f5;
    --accent-foreground: #18181b;
    --shadow:            0 1px 2px 0 rgb(0 0 0 / .05);
  }
  :root[data-theme="dark"]{
    --background:        #09090b;
    --card:              #18181b;
    --card-foreground:   #fafafa;
    --muted-foreground:  #a1a1aa;
    --border:            #27272a;
    --input:             #27272a;
    --primary:           #fafafa;
    --primary-foreground:#18181b;
    --primary-hover:     #e4e4e7;
    --secondary:         #27272a;
    --secondary-fg:      #fafafa;
    --secondary-hover:   #3f3f46;
    --accent:            #27272a;
    --accent-foreground: #fafafa;
    --shadow:            0 1px 2px 0 rgb(0 0 0 / .35);
  }

  /* ---------- toolbar melayang di pojok kiri atas ----------
     Sengaja SELALU gelap di kedua tema, mengikuti acuan. Karena itu
     warnanya ditulis tetap, bukan memakai token tema. */
  .toolbar{
    position:fixed;
    top:16px;left:16px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:2px;
    padding:3px;
    background:#09090B;
    border-radius:4px;
    box-shadow:0 4px 14px rgb(0 0 0 / .18);
  }
  .tool{
    display:flex;align-items:center;justify-content:center;
    width:32px;height:32px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#fafafa;
    cursor:pointer;
    transition:background-color .15s ease;
  }
  .tool:hover{background:rgb(255 255 255 / .10)}
  .tool:focus-visible{outline:2px solid #fafafa;outline-offset:2px}
  .tool svg{width:18px;height:18px}
  /* bulan tampil saat tema terang, matahari saat tema gelap */
  .tool .sun{display:none}
  :root[data-theme="dark"] .tool .sun{display:block}
  :root[data-theme="dark"] .tool .moon{display:none}

  *{box-sizing:border-box;margin:0;padding:0}

  /* flex min-h-screen w-full items-center justify-center bg-background p-4 */
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:var(--background);
    color:var(--card-foreground);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* flex flex-col items-center justify-center */
  .auth{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}

  /* Card: w-full max-w-sm rounded-lg border bg-card shadow-sm
     + animate-in fade-in-0 zoom-in-95 slide-in-from-bottom-4 duration-500 */
  .card{
    width:100%;
    max-width:24rem;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    box-shadow:var(--shadow);
    animation:enter .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes enter{
    from{opacity:0;transform:scale(.95) translateY(1rem)}
    to  {opacity:1;transform:none}
  }

  /* CardHeader: flex flex-col space-y-1.5 p-6 + text-center */
  .card-header{display:flex;flex-direction:column;gap:6px;padding:24px;text-align:center}
  .logo-wrap{display:flex;justify-content:center;margin-bottom:16px}  /* mb-4 flex justify-center */
  /* h-12 w-12 object-contain rounded-[4px].
     Acuan memakai logo yang petaknya sudah hitam; logo BAKED berupa wordmark
     di latar transparan, jadi petak hitamnya dibuat di sini dan mark putih
     diletakkan di dalamnya. */
  .logo{
    height:48px;width:48px;
    object-fit:contain;
    border-radius:4px;
    background:#000000;
    padding:7px;
  }
  .card-title{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
  .card-desc{font-size:14px;line-height:1.5;color:var(--muted-foreground)}

  /* CardContent: grid gap-4 p-6 pt-0 */
  .card-content{display:grid;gap:16px;padding:0 24px 24px}
  /* CardFooter: flex flex-col p-6 pt-0 */
  .card-footer{display:flex;flex-direction:column;padding:0 24px 24px}

  /* Button dasar: inline-flex items-center justify-center rounded-lg text-sm
     font-medium h-9 px-4 py-2 + w-full transition-transform hover:scale-[1.03] */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:36px;
    padding:8px 16px;
    border:0;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    line-height:1;
    white-space:nowrap;
    text-decoration:none;
    cursor:pointer;
    transition:transform .15s ease, background-color .15s ease, color .15s ease;
  }
  .btn:hover{transform:scale(1.03)}
  .btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .btn svg{width:16px;height:16px;margin-right:8px;flex:none}   /* mr-2 h-4 w-4 */

  /* variant default */
  .btn-primary{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow)}
  .btn-primary:hover{background:var(--primary-hover)}
  /* variant secondary */
  .btn-secondary{background:var(--secondary);color:var(--secondary-fg);box-shadow:var(--shadow)}
  .btn-secondary:hover{background:var(--secondary-hover)}
  /* variant outline */
  .btn-outline{background:transparent;color:var(--card-foreground);border:1px solid var(--input);box-shadow:var(--shadow)}
  .btn-outline:hover{background:var(--accent);color:var(--accent-foreground)}

  /* grid gap-2 pembungkus tombol sekunder */
  .secondary-grid{display:grid;gap:8px}

  /* separator "OR": relative my-1 + garis absolut + label di tengah */
  .or{position:relative;margin:4px 0}
  .or-line{position:absolute;inset:0;display:flex;align-items:center}
  .or-line span{width:100%;border-top:1px solid var(--border)}
  .or-label{position:relative;display:flex;justify-content:center;font-size:12px;text-transform:uppercase}
  /* Komponen aslinya memakai bg-background di sini. Pada tema shadcn bawaan
     --background dan --card bernilai sama, sedangkan di situs ini berbeda —
     jadi dipakai --card supaya label benar-benar menutup garisnya. */
  .or-label span{background:var(--card);padding:0 8px;color:var(--muted-foreground)}

  /* kotak pesan status dari callback OAuth (bukan bagian komponen) */
  .msg{
    display:none;
    padding:11px 13px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--secondary);
    color:var(--secondary-fg);
    font-size:13.5px;
    line-height:1.5;
    text-align:left;
  }
  .msg.on{display:block}

  /* footerContent: mt-6 w-full max-w-sm px-8 text-center text-sm
     text-muted-foreground + animasi sama, [animation-delay:200ms] */
  .auth-footer{
    margin-top:24px;
    width:100%;
    max-width:24rem;
    padding:0 32px;
    text-align:center;
    font-size:14px;
    line-height:1.55;
    color:var(--muted-foreground);
    animation:enter .5s cubic-bezier(.16,1,.3,1) both;
    animation-delay:200ms;
  }
  .auth-footer u{cursor:pointer;transition:color .15s ease}
  .auth-footer u:hover{color:var(--primary)}

  @media(prefers-reduced-motion:reduce){
    .card,.auth-footer{animation:none}
    .btn:hover{transform:none}
  }
</style>
</head>

<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var box = document.getElementById('msg');

    function say(text) {
      box.textContent = text;
      box.className = 'msg on';
      box.scrollIntoView({ block: 'nearest' });
    }

    // Teruskan halaman tujuan supaya setelah login user kembali ke sana.
    var next = q.get('next');
    if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') {
      document.getElementById('signin').href =
        '/api/auth/login?next=' + encodeURIComponent(next);
    }

    // Email & GitHub: tampilan sudah ada, backend-nya belum dibuat.
    document.querySelectorAll('[data-soon]').forEach(function (b) {
      b.addEventListener('click', function () {
        say('Login lewat ' + b.dataset.soon + ' belum tersedia. Sementara ini gunakan Google.');
      });
    });

    // "Skip for now" tidak bisa melewati gerbang: pemeriksaan sesi berjalan
    // di server (middleware), bukan di halaman ini. Tanpa cookie sesi yang
    // sah, permintaan ke halaman mana pun tetap dipantulkan ke sini.
    document.querySelector('[data-skip]').addEventListener('click', function () {
      say('Dokumentasi ini tidak bisa dibuka tanpa login. Silakan masuk dengan Google.');
    });

    // toolbar: ganti tema (tersimpan di perangkat ini) & muat ulang
    document.getElementById('themeBtn').addEventListener('click', function () {
      var root = document.documentElement;
      var dark = root.getAttribute('data-theme') === 'dark';
      if (dark) root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', 'dark');
      try { localStorage.setItem('login-theme', dark ? 'light' : 'dark'); } catch (e) {}
    });
    document.getElementById('reloadBtn').addEventListener('click', function () {
      location.reload();
    });
    document.getElementById('fsBtn').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    var TEXT = {
      notallowed: 'Akun Google kamu berhasil dikenali, tapi emailnya belum terdaftar. Hubungi admin IT untuk didaftarkan.',
      unverified: 'Email pada akun Google itu belum terverifikasi.',
      invalid:    'Proses login tidak selesai. Coba ulangi.',
      loggedout:  'Kamu sudah keluar. Masuk lagi untuk membuka dokumentasi.'
    };
    if (TEXT[q.get('error')]) say(TEXT[q.get('error')]);
  })();
</script>
